[project]
name = "icepick"
version = "0.1.0"
description = "Deterministic IDA Pro extraction gateway: batch schema-v1 JSON extraction and SQLite ingestion"
readme = "README.md"
license = "AGPL-3.0-only"
authors = [
    { name = "walkthestars", email = "64265241+walkthestars@users.noreply.github.com" }
]
keywords = [
    "ida-pro",
    "idalib",
    "reverse-engineering",
    "disassembly",
    "binary-analysis",
    "diaphora",
    "sqlite",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/walkthestars/icepick"
Repository = "https://github.com/walkthestars/icepick"
Issues = "https://github.com/walkthestars/icepick/issues"

[project.scripts]
icepick = "icepick.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/icepick"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:faulthandler"
